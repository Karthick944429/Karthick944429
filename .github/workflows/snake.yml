name: Generate Contribution Animations

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-animations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Karthick944429
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate Pac-Man SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Karthick944429
          outputs: |
            dist/pacman-contribution-graph.svg?type=pacman
            dist/pacman-contribution-graph-dark.svg?type=pacman&palette=github-dark

      - name: Push all SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
